name: Build Masrofi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -q masrofi-android-project.zip
      - name: Build APK
        run: gradle -p masrofi-android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masrofi-APK
          path: masrofi-android/app/build/outputs/apk/debug/app-debug.apk
